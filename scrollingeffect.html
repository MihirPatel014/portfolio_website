<div class="container">

    <div class="row">
        <div class="col-12">
            <div class="cards">
                <div class="custom-card card1" id="1" style=" z-index: 2;">
                    <h1>Slide 1</h1>
                </div>
                <div class="custom-card card2" id="2" style=" z-index: 3;">
                    <h1>Slide 2</h1>
                </div>
                <div class="custom-card card3" id="3" style="z-index: 4;">
                    <h1>Slide 3</h1>
                </div>

                <div class="custom-card card4" id="4" style="z-index: 5;">
                    <h1>Slide 4</h1>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .cards {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 70vh;
        margin-bottom: 90px;
    }

    .custom-card {
        position: absolute;
        width: 80%;
        top: 0px;
        height: 70vh;
        background: -webkit-linear-gradient(130deg,
                #d754ad 0%,
                #f96785 67%,
                #fe7333 100%);
        background: linear-gradient(-40deg, #d754ad 0%, #f96785 67%, #fe7333 100%);
        color: #fff;
        margin-bottom: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50px;
        box-shadow: 0 0 30px 0 rgba(0, 0, 0, 0.2);
    }

    .card1 {}

    .card2 {
        top: 30px;
    }

    .card3 {
        top: 60px;
    }

    .card4 {
        top: 90px;
    }

    .opacity {
        -moz-transition: 0.4s ease;
        -ms-transition: 0.4s ease;
        -o-transition: 0.4s ease;
        transition: 0.4s ease;
        -webkit-transition: 0.4s ease;
        opacity: 0.6;
    }

    .scale {
        moz-transition: 0.4s ease;
        -ms-transition: 0.4s ease;
        -o-transition: 0.4s ease;
        transition: 0.4s ease;
        -webkit-transition: 0.4s ease;
        width: 95%;
    }
</style>

<script>
    gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

    let tl = gsap.timeline({
        scrollTrigger: {
            trigger: ".cards",
            pin: true,
            pinSpacing: true,
            markers: false,
            start: "top-=50px top", // when the top of the trigger hits the top of the viewport
            end: "+=2000", // end after scrolling 1000px beyond the start
            scrub: 1, // smooth scrubbing, takes 1 second to "catch up" to the scrollbar
        }
    });

    // Animation for card 1
    tl.addLabel("card1");
    tl.to('.card1', {
        yPercent: 0,
        opacity: 1
    })

    // Animation for card 2
    tl.from('.card2', {
        yPercent: 75,
        opacity: 0,
    })
    tl.addLabel("card2");
    tl.add(() => setActiveNav(tl.scrollTrigger.direction > 0 ? 1 : 0), "-=0.15");
    tl.to('.card1', {
        scale: 0.925,
        yPercent: -0.75,
        opacity: 1
    }, "-=0.3")
    tl.to('.card2', {
        yPercent: 0,
        opacity: 1
    })

    // Animation for card 3
    tl.from('.card3', {
        yPercent: 75,
        opacity: 0,
    })
    tl.addLabel("card3");
    tl.add(() => setActiveNav(tl.scrollTrigger.direction > 0 ? 2 : 1), "-=0.15");
    tl.to('.card2', {
        scale: 0.95,
        yPercent: -0.5,
        opacity: 1
    }, "-=0.3")
    tl.to('.card3', {
        yPercent: 0,
        opacity: 1
    })

    // Animation for card 4
    tl.from('.card4', {
        yPercent: 75,
        opacity: 0,
    })
    tl.addLabel("card4");
    tl.add(() => setActiveNav(tl.scrollTrigger.direction > 0 ? 3 : 2), "-=0.15");
    tl.to('.card3', {
        scale: 0.98,
        yPercent: -0.4,
        opacity: 1
    }, "-=0.3")
    tl.to('.card4', {
        yPercent: 0,
        opacity: 1
    })

    // Additional animations for scaling down previous cards
    tl.to('.card1', {
        scale: 0.925,
        yPercent: -1.5,
        opacity: 0.9
    }, "-=0.3")

    tl.to('.card2', {
        scale: 0.95,
        yPercent: -1.125,
        opacity: 0.9
    }, "-=0.3")

    tl.to('.card3', {
        scale: 0.98,
        yPercent: -0.85,
        opacity: 0.9
    }, "-=0.3")

    // Without the .nav .circle elements, we don't need to handle setActiveNav function
    /* gsap.utils.toArray(".nav .circle").forEach((circle, i) => {
      circle.classList[i === index ? "add" : "remove"]("active");
    }); */

    function labelToScroll(timeline, label) {
        let st = timeline.scrollTrigger,
            progress = timeline.labels[label] / timeline.duration();
        return st.start + (st.end - st.start) * progress;
    }

</script>
